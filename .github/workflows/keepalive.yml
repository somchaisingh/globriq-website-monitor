name: Keep monitoring schedules active
on:
  schedule:
    - cron: '27 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: globriq-monitor-keepalive
  cancel-in-progress: false
jobs:
  activity:
    if: github.repository == 'somchaisingh/globriq-website-monitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record monthly activity in this monitor repository only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.error, urllib.request
          url = 'https://api.github.com/repos/somchaisingh/globriq-website-monitor/contents/monitor-activity.json'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          body = {'message': 'chore: keep public monitoring schedules active', 'branch': 'main', 'content': base64.b64encode((json.dumps({'updated': datetime.datetime.now(datetime.timezone.utc).isoformat()}) + '\n').encode()).decode()}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                  body['sha'] = json.load(response)['sha']
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          with urllib.request.urlopen(urllib.request.Request(url, method='PUT', headers=headers, data=json.dumps(body).encode()), timeout=20) as response:
              print(json.dumps({'monitorRepositoryOnly': True, 'status': response.status}))
          PY
